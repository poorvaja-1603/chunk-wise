services:
  - type: web
    name: chunkwise
    env: python
    buildCommand: "pip install -e ."
    startCommand: "chunkwise-web"
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: CHUNKWISE_HOST
        value: 0.0.0.0
      - key: CHUNKWISE_BACKEND
        value: local
      - key: CHUNKWISE_HOME
        value: ./.chunkwise
      - key: CHUNKWISE_MAX_UPLOAD_BYTES
        value: "104857600"
      - key: CHUNKWISE_CLOUDWATCH
        value: "0"

